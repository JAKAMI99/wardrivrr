# Car mini-PC overlay — use with root compose:
#   docker compose -f docker-compose.yml -f deploy/compose.car.yml --env-file .env up -d
#
# Prefer local API build (FORCE_LOCAL_BUILD=1) or optional GHCR.
#
# gpsd + Kismet stay on the HOST (systemd / apt). There is no reliable public
# `kismetwireless/kismet` Docker Hub image — do not pull one.
# API reaches host gpsd/Kismet via host-gateway.

services:
  postgis:
    env_file:
      - ./.env
    # Mini-PC friendly memory (override the base compose if it was higher)
    command: postgres -c shared_buffers=128MB -c work_mem=16MB -c maintenance_work_mem=64MB -c effective_cache_size=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  valhalla:
    env_file:
      - ./.env

  api:
    # WARDRIVRR_IMAGE may be a tag or an immutable digest, for example:
    # ghcr.io/owner/wardrivrr@sha256:...
    image: ${WARDRIVRR_IMAGE:-ghcr.io/OWNER/wardrivrr:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wardrivrr_api
    restart: unless-stopped
    # Host network: API reaches gpsd+Kismet on 127.0.0.1 (Docker bridge often
    # cannot; Status was false-negative while host curl worked).
    network_mode: host
    env_file:
      - ./.env
    environment:
      # postgis/valhalla publish ports on the host in this mode
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-wardriving}
      DB_USER: ${DB_USER:-explorer}
      DB_PASS: ${DB_PASS:-secure_password_here}
      VALHALLA_URL: http://127.0.0.1:8002
      GPSD_HOST: 127.0.0.1
      GPSD_PORT: ${GPSD_PORT:-2947}
      GPSD_ENABLED: ${GPSD_ENABLED:-1}
      KISMET_URL: http://127.0.0.1:2501
      KISMET_USER: ${KISMET_USER:-wardrivrr}
      KISMET_PASSWORD: ${KISMET_PASSWORD:-changeme}
      KISMET_LIVE: ${KISMET_LIVE:-1}
      KISMET_LOG_DIR: /data/kismet_logs
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      WARDRIVRR_MODE: ${WARDRIVRR_MODE:-full}
      DATA_ROOT: /app/data
    volumes:
      - ./data:/app/data
      - ./data/kismet_logs:/data/kismet_logs:ro
    depends_on:
      postgis:
        condition: service_healthy
      # Valhalla is optional until data/valhalla/active.osm.pbf exists (level prepare).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s

  # Optional legacy profile only — default stack does NOT start a Kismet container.
  # Prefer host apt packages (see scripts/car_setup.sh).
  kismet:
    profiles: ["kismet-docker"]
    image: ${KISMET_DOCKER_IMAGE:-finchsec/kismet:latest}
    container_name: wardrivrr_kismet
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./deploy/kismet/kismet_site.conf:/etc/kismet/kismet_site.conf:ro
      - ./data/kismet_logs:/home/kismet/logs
