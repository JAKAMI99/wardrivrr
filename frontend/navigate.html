<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e11" />
    <title>Navigate · wardrivrr</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/themes.css?v=5" />
    <script src="/static/theme.js?v=8"></script>
    <link rel="stylesheet" href="/static/navigate.css?v=35" />
  </head>
  <body class="nav-body" data-nav-night="0">
    <div class="app-shell nav-shell">
      <nav class="site-nav nav-site-nav" aria-label="Primary">
        <a class="site-brand" href="/">wardrivrr <span>drive</span></a>
        <div class="site-links"></div>
      </nav>

      <main class="nav-main">
        <div id="navMap" class="nav-map" role="application" aria-label="Navigation map"></div>

        <section class="nav-hud-side" aria-live="polite" hidden>
          <div class="nav-maneuver next" id="maneuverNext">
            <div class="nav-turn-arrow" id="maneuverNextArrow" aria-hidden="true"></div>
            <div class="nav-turn-meta">
              <span class="nav-maneuver-dist" id="maneuverNextDist">—</span>
              <span class="nav-maneuver-unit" id="maneuverNextUnit"></span>
              <span class="nav-maneuver-sr" id="maneuverNextText"></span>
            </div>
          </div>
        </section>

        <div id="levelPrompt" class="nav-level-prompt" hidden>
          <div class="nav-level-card">
            <p class="nav-level-title">Generate level?</p>
            <p class="nav-level-name" id="levelPromptName">—</p>
            <p class="muted nav-level-sub">
              No level covers this spot yet. Auto-confirm in
              <span id="levelPromptSec">20</span>s
            </p>
            <label class="nav-level-opt" title="Skip cul-de-sac tips when routing (roads stay in the level)">
              <input type="checkbox" id="levelPromptDeadEnds" />
              Skip dead ends when routing
            </label>
            <div class="nav-level-actions">
              <button type="button" class="btn" id="levelPromptNo">Not now</button>
              <button type="button" class="btn btn-primary nav-yes-fill" id="levelPromptYes">
                <span class="nav-yes-fill-bar" id="levelPromptFill"></span>
                <span class="nav-yes-fill-label">Yes</span>
              </button>
            </div>
          </div>
        </div>

        <div id="navBuildOverlay" class="nav-build-overlay" hidden>
          <div class="nav-build-card">
            <h2 id="navBuildTitle">Building your level…</h2>
            <p class="muted" id="navBuildMessage">Starting…</p>
            <div class="nav-build-progress">
              <div class="nav-build-track">
                <div class="nav-build-fill" id="navBuildFill"></div>
              </div>
              <div class="nav-build-meta">
                <span id="navBuildPct">0%</span>
                <span id="navBuildEta">—</span>
              </div>
            </div>
            <ul class="nav-build-stages" id="navBuildStages">
              <li data-stage="extract">Find roads</li>
              <li data-stage="roads">Build playable segments</li>
              <li data-stage="finish">Finish up</li>
            </ul>
          </div>
        </div>

        <section class="nav-hud-stats" aria-label="Drive stats">
          <div class="nav-stat">
            <span id="statSpeed">0</span>
            <small>km/h</small>
          </div>
          <div class="nav-stat">
            <span id="statUnlock">0.0</span>
            <small>km new</small>
          </div>
          <div class="nav-stat nav-stat-radio" title="New networks · seen this drive">
            <span class="nav-stat-new" id="statWifiNew">0</span>
            <span class="nav-stat-seen" id="statWifiSeen">0</span>
            <small>Wi‑Fi</small>
          </div>
          <div class="nav-stat nav-stat-radio" title="New networks · seen this drive">
            <span class="nav-stat-new" id="statBtNew">0</span>
            <span class="nav-stat-seen" id="statBtSeen">0</span>
            <small>Bluetooth</small>
          </div>
          <div class="nav-stat nav-stat-radio" title="New networks · seen this drive">
            <span class="nav-stat-new" id="statBleNew">0</span>
            <span class="nav-stat-seen" id="statBleSeen">0</span>
            <small>BLE</small>
          </div>
          <div class="nav-stat">
            <span id="statRoute">—</span>
            <small>km left</small>
          </div>
          <div class="nav-stat">
            <span id="statLevel">—</span>
            <small>level</small>
          </div>
          <div class="nav-stat nav-stat-xp" title="Explorer level">
            <span id="statXpLevel">—</span>
            <small>XP lvl</small>
          </div>
        </section>

        <!-- Production: mute + nav start/stop + 2D/3D. Zoom/debug via pinch or ?debug=1 -->
        <section class="nav-toolbar nav-toolbar-icons" aria-label="Map controls">
          <button type="button" class="nav-icon-btn nav-nav-toggle is-muted-look" id="btnNavToggle" title="Start navigation" aria-label="Start navigation" aria-pressed="false">
            <!-- Map pin — same language as the vehicle marker -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2c-3.6 0-6.5 2.9-6.5 6.5 0 4.9 6.5 13.5 6.5 13.5s6.5-8.6 6.5-13.5C18.5 4.9 15.6 2 12 2zm0 8.8a2.3 2.3 0 110-4.6 2.3 2.3 0 010 4.6z"/>
            </svg>
          </button>
          <button type="button" class="nav-icon-btn is-muted-look" id="btnMuteSounds" title="Sounds on (tap to mute)" aria-label="Toggle achievement sounds" aria-pressed="false">
            <!-- Mute glyph; gray when sound on, colorful when muted -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/>
              <path d="M23 9l-6 6M17 9l6 6"/>
            </svg>
          </button>
          <button type="button" class="nav-icon-btn is-on" id="btnViewMode" title="3D view (tap for 2D)" aria-label="Toggle 2D or 3D view" aria-pressed="true">
            <!-- 3D cube — colorful in 3D, grayed in 2D -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/>
              <path d="M12 22V12"/>
              <path d="M3 7l9 5 9-5"/>
            </svg>
          </button>
          <p class="nav-hint muted" id="navHint" hidden>Waiting for GPS…</p>
        </section>

        <section class="nav-toolbar nav-debug-toolbar" id="navDebugToolbar" hidden aria-label="Debug controls">
          <button type="button" class="btn btn-primary" id="btnSpawn">Spawn</button>
          <button type="button" class="btn" id="btnFollowGps" title="Track GPS from tools/drive_sim replay">
            Follow live GPS
          </button>
          <button type="button" class="btn" id="btnStart" disabled>Start explore</button>
          <button type="button" class="btn" id="btnReplan" disabled>Replan</button>
          <label class="nav-toggle" title="Skip cul-de-sac tips when routing">
            <input type="checkbox" id="toggleDeadEnds" />
            Skip dead ends
          </label>
          <label class="nav-toggle" title="Requires WebGL">
            <input type="checkbox" id="toggleBuildings" />
            3D view
          </label>
          <label class="nav-toggle" title="Flipper, Starlink, train SSIDs — toasts &amp; Starlink XP">
            <input type="checkbox" id="toggleAnomaly" checked />
            Special detections
          </label>
          <label class="nav-km">
            Horizon
            <select id="targetKm">
              <option value="3">3 km</option>
              <option value="5" selected>5 km</option>
              <option value="8">8 km</option>
              <option value="12">12 km</option>
            </select>
          </label>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/nav.js?v=4"></script>
    <script src="/static/navigate.js?v=43"></script>
  </body>
</html>
