<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e11" />
    <title>Progress · wardrivrr</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/styles.css?v=11" />
    <link rel="stylesheet" href="/static/themes.css?v=5" />
    <script src="/static/theme.js?v=9"></script>
  </head>
  <body class="discover-body progress-body">
    <div class="page-glow" aria-hidden="true"></div>
    <div class="app-shell discover-shell">
      <nav class="site-nav" aria-label="Primary">
        <a class="site-brand" href="/">wardrivrr <span>local explorer</span></a>
        <div class="site-links"></div>
      </nav>

      <main class="discover-main">
        <header class="discover-bar">
          <div>
            <h1 id="progressTitle">Progress</h1>
            <p class="muted" id="progressSub">Fog of war — driven bright, untouched dark</p>
          </div>
          <div class="discover-legend" aria-label="Legend">
            <span class="legend-item"><i class="swatch locked"></i> Never driven</span>
            <span class="legend-item"><i class="swatch explored"></i> Driven</span>
          </div>
          <a class="btn" href="/levels">Levels</a>
        </header>
        <div id="progressMap" class="discover-map" role="img" aria-label="Level fog of war map"></div>
        <p class="muted discover-status" id="progressStatus">Loading…</p>
      </main>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/auth.js"></script>
    <script src="/static/nav.js?v=5"></script>
    <script src="/static/progress.js?v=3"></script>
  </body>
</html>
