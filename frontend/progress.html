<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>Progress · wardrivrr</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/styles.css?v=21" />
    <link rel="stylesheet" href="/static/themes.css?v=7" />
    <script src="/static/theme.js?v=13"></script>
  </head>
  <body class="discover-body progress-body">
    <div class="page-glow" aria-hidden="true"></div>
    <div class="app-shell discover-shell">
      <nav class="site-nav" aria-label="Primary">
        <a class="site-brand" href="/">wardrivrr <span>explore</span></a>
        <div class="site-links"></div>
      </nav>

      <main class="discover-main">
        <header class="discover-bar progress-bar">
          <div class="progress-heading">
            <div class="progress-title-row">
              <h1 id="progressTitle">Progress</h1>
              <span id="progressCompleteChip" class="progress-complete-chip" hidden></span>
            </div>
            <p class="muted progress-pct-strip" id="progressSub">Driven vs never driven</p>
          </div>
          <div class="progress-modes" id="progressModes" role="group" aria-label="Transport mode"></div>
          <div class="discover-legend" aria-label="Legend">
            <span class="legend-item"><i class="swatch locked"></i> Never driven</span>
            <span class="legend-item"><i class="swatch explored"></i> Driven</span>
          </div>
          <a class="btn" href="/regions">Regions</a>
        </header>
        <div id="progressMap" class="discover-map" role="img" aria-label="Level fog of war map"></div>
        <p class="muted discover-status" id="progressStatus">Loading...</p>
      </main>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/auth.js"></script>
    <script src="/static/nav.js?v=9"></script>
    <script src="/static/progress.js?v=6"></script>
  </body>
</html>
