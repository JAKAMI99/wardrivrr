# Base stack: PostGIS + Valhalla.
# Vehicle host (API + host Kismet): also use deploy/compose.car.yml
#   docker compose -f docker-compose.yml -f deploy/compose.car.yml --env-file .env up -d
# Image: WARDRIVRR_IMAGE=ghcr.io/<owner>/wardrivrr:latest (see ./run.sh)

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: wardrivrr_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wardriving}
      POSTGRES_USER: ${DB_USER:-explorer}
      POSTGRES_PASSWORD: ${DB_PASS:-secure_password_here}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgis/init:/docker-entrypoint-initdb.d
    command: postgres -c shared_buffers=128MB -c work_mem=16MB -c maintenance_work_mem=64MB -c effective_cache_size=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  # Tiles from data/valhalla/active.osm.pbf (city/district clip from level prepare).
  # Regional packs stay in data/pbf/; Valhalla only starts after a level is ready.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: wardrivrr_valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-}
      use_tiles_ignore_pbf: "False"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
      serve_tiles: "True"
      server_threads: ${VALHALLA_SERVER_THREADS:-4}
    volumes:
      - ./data/valhalla:/custom_files

volumes:
  pgdata:
